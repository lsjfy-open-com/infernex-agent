name: InferNex Agent offline bundle

on:
  pull_request:
    paths:
      - ".github/workflows/infernex-agent-offline-release.yaml"
      - "component/InferNex-Agent/**"
      - "component/InferNex-Bridge/api/**"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version embedded in the image and chart
        required: true
        default: "0.3.0-rc.6"
        type: string
      publish_prerelease:
        description: Publish both architectures as a GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: infernex-agent-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/${{ matrix.architecture }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUNDLE_VERSION: ${{ inputs.version || '0.3.0-rc.6' }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate version
        env:
          VERSION: ${{ env.BUNDLE_VERSION }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Test bundle scripts
        working-directory: component/InferNex-Agent
        run: |
          bash -n scripts/*.sh scripts/offline/*.sh scripts/host/*.sh test/scripts/*.sh
          bash test/scripts/download-bundle.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Build architecture-specific image archive
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ env.BUNDLE_VERSION }}
        run: |
          docker buildx build \
            --platform "linux/${ARCHITECTURE}" \
            --build-arg "VERSION=${VERSION}" \
            --file component/InferNex-Agent/Dockerfile \
            --tag "docker.io/library/infernex-agent:${VERSION}" \
            --output "type=docker,dest=${RUNNER_TEMP}/infernex-agent-images-${ARCHITECTURE}.tar" \
            component
          docker load \
            --input "${RUNNER_TEMP}/infernex-agent-images-${ARCHITECTURE}.tar"
          container_id="$(
            docker create \
              --platform "linux/${ARCHITECTURE}" \
              "docker.io/library/infernex-agent:${VERSION}"
          )"
          docker cp \
            "${container_id}:/infernex-agent" \
            "${RUNNER_TEMP}/infernex-agent-linux-${ARCHITECTURE}"
          docker rm "${container_id}"
          chmod 0755 "${RUNNER_TEMP}/infernex-agent-linux-${ARCHITECTURE}"

      - name: Assemble and verify bundle
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ env.BUNDLE_VERSION }}
        run: |
          component/InferNex-Agent/scripts/offline/build-bundle.sh \
            --version "${VERSION}" \
            --architecture "${ARCHITECTURE}" \
            --agent-image "docker.io/library/infernex-agent:${VERSION}" \
            --image-archive "${RUNNER_TEMP}/infernex-agent-images-${ARCHITECTURE}.tar" \
            --output-dir "${RUNNER_TEMP}/offline-dist"
          mkdir -p "${RUNNER_TEMP}/verify"
          tar -xzf \
            "${RUNNER_TEMP}/offline-dist/infernex-agent-offline-${VERSION}-linux-${ARCHITECTURE}.tar.gz" \
            -C "${RUNNER_TEMP}/verify"
          "${RUNNER_TEMP}/verify/infernex-agent-offline-${VERSION}-linux-${ARCHITECTURE}/bin/verify-agent.sh" \
            --checksums-only
          component/InferNex-Agent/scripts/offline/build-host-bundle.sh \
            --version "${VERSION}" \
            --architecture "${ARCHITECTURE}" \
            --binary "${RUNNER_TEMP}/infernex-agent-linux-${ARCHITECTURE}" \
            --output-dir "${RUNNER_TEMP}/offline-dist"
          mkdir -p "${RUNNER_TEMP}/verify-host"
          tar -xzf \
            "${RUNNER_TEMP}/offline-dist/infernex-agent-host-offline-${VERSION}-linux-${ARCHITECTURE}.tar.gz" \
            -C "${RUNNER_TEMP}/verify-host"
          (
            cd "${RUNNER_TEMP}/verify-host/infernex-agent-host-offline-${VERSION}-linux-${ARCHITECTURE}"
            sha256sum --check SHA256SUMS
          )

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: infernex-agent-offline-${{ env.BUNDLE_VERSION }}-linux-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/offline-dist/*.tar.gz
            ${{ runner.temp }}/offline-dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download architecture bundles
        uses: actions/download-artifact@v4
        with:
          pattern: infernex-agent-offline-${{ inputs.version }}-linux-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "infernex-agent-v${VERSION}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "InferNex Agent v${VERSION}" \
            --notes "Installable cluster and host/systemd bundles for existing InferNex clusters. Host bundles include the XShell/SSH natural-language terminal; read tools run automatically and write tools require local approval. Agent bundles do not contain vLLM, vLLM-Ascend, Mooncake, CANN, or model weights. Verify the architecture-specific outer SHA256 before extraction."
