name: InferNex Agent

on:
  pull_request:
    paths:
      - ".github/workflows/infernex-agent.yaml"
      - "component/InferNex-Agent/**"
      - "component/InferNex-Bridge/api/**"
      - "component/InferNex-Bridge/config/crd/bases/infernex.infernex.io_infernexservices.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/infernex-agent.yaml"
      - "component/InferNex-Agent/**"
      - "component/InferNex-Bridge/api/**"
      - "component/InferNex-Bridge/config/crd/bases/infernex.infernex.io_infernexservices.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infernex-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: component/InferNex-Agent/go.sum

      - name: Test and vet
        working-directory: component/InferNex-Agent
        run: |
          go test -race ./...
          go vet ./...
          bash -n scripts/*.sh scripts/offline/*.sh scripts/host/*.sh test/scripts/*.sh
          bash test/scripts/download-bundle.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Lint and render Helm chart
        working-directory: component/InferNex-Agent
        run: |
          helm lint ./chart/infernex-agent
          helm template infernex-agent ./chart/infernex-agent \
            --namespace infernex-system \
            --set 'rbac.targetNamespaces[0]=model-a' \
            --set 'rbac.targetNamespaces[1]=model-b' \
            >/dev/null
          helm template infernex-agent ./chart/infernex-agent \
            --namespace infernex-system \
            --set rbac.clusterWide=true \
            >/dev/null
          helm template infernex-agent ./chart/infernex-agent \
            --namespace infernex-system \
            --set 'rbac.targetNamespaces[0]=models' \
            --set tools.deployment.enabled=true \
            >/dev/null
          master_render="$(
            helm template infernex-agent ./chart/infernex-agent \
              --namespace infernex-system \
              --values ./chart/infernex-agent/values-master-node.yaml \
              --set 'rbac.targetNamespaces[0]=models'
          )"
          grep -q 'nodePort: 30081' <<<"${master_render}"
          grep -q 'node-role.kubernetes.io/control-plane' <<<"${master_render}"
          grep -q -- '--scan-namespaces=models' <<<"${master_render}"
          grep -q 'name: infernex-agent-dashboard' <<<"${master_render}"
          openai_render="$(
            helm template infernex-agent ./chart/infernex-agent \
              --namespace infernex-system \
              --set 'rbac.targetNamespaces[0]=models' \
              --set supervisor.analysis.openAI.baseURL=http://model.internal:8000/v1 \
              --set supervisor.analysis.openAI.model=ops-model \
              --set supervisor.analysis.openAI.existingSecret=infernex-openai
          )"
          grep -q -- '--openai-model=ops-model' <<<"${openai_render}"
          grep -q 'name: INFERNEX_OPENAI_API_KEY' <<<"${openai_render}"
          remediation_render="$(
            helm template infernex-agent ./chart/infernex-agent \
              --namespace infernex-system \
              --set 'rbac.targetNamespaces[0]=models' \
              --set supervisor.remediation.enabled=true \
              --set supervisor.remediation.templateNamespace=infernex-bridge-system
          )"
          grep -q -- '--enable-auto-recovery' <<<"${remediation_render}"
          grep -q 'name: infernex-agent-recovery-profiles' <<<"${remediation_render}"
          grep -q 'resources:.*infernexserviceconfigs' <<<"${remediation_render}"
          if helm template infernex-agent ./chart/infernex-agent \
            --namespace infernex-system \
            --set rbac.clusterWide=true \
            --set tools.deployment.enabled=true \
            >/dev/null 2>&1; then
            echo "cluster-wide mutation render unexpectedly succeeded"
            exit 1
          fi
          if helm template infernex-agent ./chart/infernex-agent \
            --namespace infernex-system \
            --set rbac.clusterWide=true \
            --set supervisor.remediation.enabled=true \
            >/dev/null 2>&1; then
            echo "cluster-wide auto-remediation render unexpectedly succeeded"
            exit 1
          fi

      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.31.0

      - name: Create Kind cluster
        run: |
          kind create cluster \
            --name infernex-agent \
            --image "${KIND_NODE_IMAGE}" \
            --wait 120s

      - name: Build and load control-plane images
        run: |
          docker build \
            --build-arg VERSION=e2e \
            --file component/InferNex-Agent/Dockerfile \
            --tag infernex-agent:e2e \
            component
          kind load docker-image infernex-agent:e2e --name infernex-agent
          docker build \
            --tag infernex-bridge:e2e \
            component/InferNex-Bridge
          kind load docker-image infernex-bridge:e2e --name infernex-agent

      - name: Build and verify offline bundle
        run: |
          docker tag infernex-agent:e2e docker.io/library/infernex-agent:0.3.0
          docker save \
            --output "${RUNNER_TEMP}/infernex-agent-images-amd64.tar" \
            docker.io/library/infernex-agent:0.3.0
          component/InferNex-Agent/scripts/offline/build-bundle.sh \
            --version 0.3.0 \
            --architecture amd64 \
            --agent-image docker.io/library/infernex-agent:0.3.0 \
            --image-archive "${RUNNER_TEMP}/infernex-agent-images-amd64.tar" \
            --output-dir "${RUNNER_TEMP}/offline-dist"
          mkdir -p "${RUNNER_TEMP}/offline-extracted"
          tar -xzf \
            "${RUNNER_TEMP}/offline-dist/infernex-agent-offline-0.3.0-linux-amd64.tar.gz" \
            -C "${RUNNER_TEMP}/offline-extracted"
          "${RUNNER_TEMP}/offline-extracted/infernex-agent-offline-0.3.0-linux-amd64/bin/verify-agent.sh" \
            --checksums-only
          helm lint \
            "${RUNNER_TEMP}/offline-extracted/infernex-agent-offline-0.3.0-linux-amd64/charts/infernex-agent-0.3.0.tgz"
          (
            cd component/InferNex-Agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=0.3.0" \
              -o "${RUNNER_TEMP}/infernex-agent-linux-amd64" \
              ./cmd/infernex-agent
          )
          component/InferNex-Agent/scripts/offline/build-host-bundle.sh \
            --version 0.3.0 \
            --architecture amd64 \
            --binary "${RUNNER_TEMP}/infernex-agent-linux-amd64" \
            --output-dir "${RUNNER_TEMP}/offline-dist"
          mkdir -p "${RUNNER_TEMP}/host-extracted"
          tar -xzf \
            "${RUNNER_TEMP}/offline-dist/infernex-agent-host-offline-0.3.0-linux-amd64.tar.gz" \
            -C "${RUNNER_TEMP}/host-extracted"
          (
            cd "${RUNNER_TEMP}/host-extracted/infernex-agent-host-offline-0.3.0-linux-amd64"
            sha256sum --check SHA256SUMS
            ./payload/infernex-agent --help >/dev/null
            test -x ./install.sh
            ./install.sh --help >/dev/null
            test -x ./bin/chat.sh
            test -f ./docs/install-and-modes-zh.md
          )

      - name: Install test CRDs
        working-directory: component/InferNex-Agent
        run: |
          kubectl apply --server-side -f ../InferNex-Bridge/config/crd/bases/infernex.infernex.io_infernexservices.yaml
          lws_dir="$(go list -m -f '{{.Dir}}' sigs.k8s.io/lws)"
          kubectl apply --server-side -f "${lws_dir}/config/crd/bases/leaderworkerset.x-k8s.io_leaderworkersets.yaml"
          kubectl wait --for=condition=Established \
            crd/infernexservices.infernex.infernex.io \
            crd/leaderworkersets.leaderworkerset.x-k8s.io \
            --timeout=60s

      - name: Run Kind smoke test
        run: bash component/InferNex-Agent/test/e2e/smoke.sh

      - name: Run real tiny-model deployment and inference test
        run: bash component/InferNex-Agent/test/e2e/tiny-model.sh

      - name: Reinstall Agent from offline bundle
        run: |
          helm uninstall infernex-agent --namespace infernex-system
          "${RUNNER_TEMP}/offline-extracted/infernex-agent-offline-0.3.0-linux-amd64/bin/install-agent.sh" \
            --skip-image-import \
            --agent-image infernex-agent:e2e \
            --target-namespace models \
            --dashboard-cluster-ip

      - name: Install host Agent with dedicated identity
        run: |
          host_bundle="${RUNNER_TEMP}/host-extracted/infernex-agent-host-offline-0.3.0-linux-amd64"
          sudo "${host_bundle}/install.sh" \
            --admin-kubeconfig "${HOME}/.kube/config" \
            --skip-model-setup
          sudo systemd-analyze verify \
            /etc/systemd/system/infernex-agent.service
          sudo "${host_bundle}/bin/verify-host.sh" \
            --kubeconfig /etc/infernex-agent/kubeconfig \
            --target-namespace infernex-agent-workspace
          sudo /opt/infernex-agent/bin/infernex-agent doctor \
            --config /etc/infernex-agent/agent.conf \
            --skip-model
          sudo test -x /opt/infernex-agent/bin/configure-model.sh
          sudo test -x /opt/infernex-agent/bin/restore-host-install.sh
          sudo test -x /opt/infernex-agent/bin/chat.sh
          sudo test -x /usr/local/bin/infernex-agent
          sudo /usr/local/bin/infernex-agent version --json |
            grep -q '0.3.0'
          sudo grep -q -- '--deployment-namespace=infernex-agent-workspace' \
            /etc/infernex-agent/agent.conf
          recovery_point="$(sudo sh -c \
            'ls -dt /var/lib/infernex-agent/backups/install-* | head -n 1')"
          sudo /opt/infernex-agent/bin/infernex-agent cluster-state verify \
            --input "${recovery_point}/cluster-state.json" |
            grep -q '"valid": true'
          sudo grep -q -- '--scan-namespaces=infernex-agent-workspace' \
            /etc/infernex-agent/agent.conf
          sudo /opt/infernex-agent/bin/configure-model.sh --show |
            grep -q 'model_analysis=disabled'

          python3 - <<'PY' >"${RUNNER_TEMP}/host-model.log" 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("content-length", "0"))
                  request = json.loads(self.rfile.read(length))
                  message = {"role": "assistant", "content": "OK"}
                  if any(
                      item.get("function", {}).get("name") == "infernex_test_tool"
                      for item in request.get("tools", [])
                  ):
                      message = {
                          "role": "assistant",
                          "content": None,
                          "tool_calls": [{
                              "id": "ci-tool-call",
                              "type": "function",
                              "function": {
                                  "name": "infernex_test_tool",
                                  "arguments": "{}",
                              },
                          }],
                      }
                  body = json.dumps({
                      "model": "ci-diagnostic-model",
                      "choices": [{
                          "message": message
                      }],
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, _format, *_args):
                  pass

          HTTPServer(("127.0.0.1", 19090), Handler).serve_forever()
          PY
          model_server_pid=$!
          trap 'kill "${model_server_pid}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl --silent http://127.0.0.1:19090/ >/dev/null; then
              break
            fi
            sleep 1
          done

          printf 'ci-test-key\n' >"${RUNNER_TEMP}/host-model.key"
          sudo /opt/infernex-agent/bin/configure-model.sh \
            --base-url http://127.0.0.1:19090/v1 \
            --model ci-diagnostic-model \
            --api-key-file "${RUNNER_TEMP}/host-model.key" \
            --timeout 30s \
            --test-tools \
            --show |
            grep -q 'model_analysis=enabled'
          sudo grep -q \
            -- '--openai-api-key-file=/etc/infernex-agent/openai-api-key' \
            /etc/infernex-agent/agent.conf
          ! sudo grep -q 'ci-test-key' \
            /etc/infernex-agent/agent.conf \
            /etc/systemd/system/infernex-agent.service
          sudo systemctl is-active --quiet infernex-agent.service
          sudo /opt/infernex-agent/bin/infernex-agent doctor \
            --config /etc/infernex-agent/agent.conf
          sudo /opt/infernex-agent/bin/chat.sh --ask 'Reply with OK.' |
            grep -q 'OK'

          sudo "${host_bundle}/bin/install-host.sh" \
            --kubeconfig /etc/infernex-agent/kubeconfig \
            --scan-namespace infernex-agent-workspace
          sudo grep -q \
            -- '--openai-model=ci-diagnostic-model' \
            /etc/infernex-agent/agent.conf
          sudo test -s /etc/infernex-agent/openai-api-key
          sudo /opt/infernex-agent/bin/configure-model.sh --test

          sudo /opt/infernex-agent/bin/configure-model.sh --disable --show |
            grep -q 'model_analysis=disabled'
          sudo test ! -e /etc/infernex-agent/openai-api-key
          ! sudo grep -q -- '--openai-' /etc/infernex-agent/agent.conf
          sudo systemctl is-active --quiet infernex-agent.service

          second_recovery_point="$(sudo sh -c \
            'ls -dt /var/lib/infernex-agent/backups/install-* | head -n 1')"
          sudo /opt/infernex-agent/bin/restore-host-install.sh \
            --backup-dir "${second_recovery_point}" \
            --confirm
          sudo grep -q \
            -- '--openai-model=ci-diagnostic-model' \
            /etc/infernex-agent/agent.conf
          sudo test -s /etc/infernex-agent/openai-api-key
          sudo /opt/infernex-agent/bin/configure-model.sh --test
          sudo systemctl is-active --quiet infernex-agent.service

          sudo /opt/infernex-agent/bin/configure-model.sh --disable

          candidate_binary="${RUNNER_TEMP}/infernex-agent-systemd-candidate"
          (
            cd component/InferNex-Agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=0.4.0-candidate.ci -X main.commit=${GITHUB_SHA}" \
              -o "${candidate_binary}" \
              ./cmd/infernex-agent
          )
          chmod 0755 "${candidate_binary}"
          baseline_sha="$(sudo sha256sum /opt/infernex-agent/bin/infernex-agent | awk '{print $1}')"
          sudo "${candidate_binary}" candidate verify \
            --file "${candidate_binary}"
          sudo "${candidate_binary}" candidate apply \
            --file "${candidate_binary}" \
            --timeout 60s
          sudo /opt/infernex-agent/bin/infernex-agent version --json |
            grep -q '0.4.0-candidate.ci'
          sudo /opt/infernex-agent/bin/infernex-agent candidate rollback \
            --timeout 60s
          restored_sha="$(sudo sha256sum /opt/infernex-agent/bin/infernex-agent | awk '{print $1}')"
          test "${restored_sha}" = "${baseline_sha}"
          sudo systemctl is-active --quiet infernex-agent.service

          kill "${model_server_pid}" >/dev/null 2>&1 || true
          wait "${model_server_pid}" 2>/dev/null || true
          trap - EXIT
          sudo "${host_bundle}/bin/uninstall-host.sh" \
            --purge-credentials \
            --purge-state \
            --purge-user

      - name: Upload deployable offline bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infernex-agent-offline-0.3.0-linux-amd64
          path: |
            ${{ runner.temp }}/offline-dist/infernex-agent-offline-0.3.0-linux-amd64.tar.gz
            ${{ runner.temp }}/offline-dist/infernex-agent-offline-0.3.0-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload host offline bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infernex-agent-host-offline-0.3.0-linux-amd64
          path: |
            ${{ runner.temp }}/offline-dist/infernex-agent-host-offline-0.3.0-linux-amd64.tar.gz
            ${{ runner.temp }}/offline-dist/infernex-agent-host-offline-0.3.0-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get all -A -o wide || true
          kubectl get infernexservices -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n infernex-system logs deployment/infernex-agent || true
          kubectl -n infernex-bridge-system logs deployment/infernex-bridge || true
          kubectl -n models logs deployment/kind-smollm-engine-aggregate \
            --all-containers --prefix || true
          sudo systemctl status infernex-agent.service --no-pager || true
          sudo journalctl -u infernex-agent.service --no-pager -n 200 || true

      - name: Delete Kind cluster
        if: always()
        run: |
          host_uninstaller="${RUNNER_TEMP}/host-extracted/infernex-agent-host-offline-0.3.0-linux-amd64/bin/uninstall-host.sh"
          if [[ -x "${host_uninstaller}" ]]; then
            sudo "${host_uninstaller}" \
              --purge-credentials \
              --purge-state \
              --purge-user || true
          fi
          kind delete cluster --name infernex-agent

  candidate:
    name: Candidate linux/${{ matrix.architecture }}
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64

    steps:
      - name: Check out tested source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: component/InferNex-Agent/go.sum

      - name: Build static candidate binary
        working-directory: component/InferNex-Agent
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          candidate_version="0.4.0-candidate.${short_sha}"
          candidate_name="infernex-agent-${candidate_version}-linux-${ARCHITECTURE}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCHITECTURE}" \
            go build -trimpath \
            -ldflags="-s -w -X main.version=${candidate_version} -X main.commit=${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/${candidate_name}" \
            ./cmd/infernex-agent
          chmod 0755 "${RUNNER_TEMP}/${candidate_name}"
          (
            cd "${RUNNER_TEMP}"
            sha256sum "${candidate_name}" >"${candidate_name}.sha256"
          )
          if [[ "${ARCHITECTURE}" == "amd64" ]]; then
            "${RUNNER_TEMP}/${candidate_name}" version --json | tee "${RUNNER_TEMP}/version.json"
            grep -q '"cgoEnabled":"0"' "${RUNNER_TEMP}/version.json"
            grep -q "${GITHUB_SHA}" "${RUNNER_TEMP}/version.json"
            bash test/scripts/candidate-smoke.sh "${RUNNER_TEMP}/${candidate_name}"
          fi
          if readelf -l "${RUNNER_TEMP}/${candidate_name}" | grep -q 'Requesting program interpreter'; then
            echo "candidate unexpectedly contains a dynamic interpreter"
            exit 1
          fi
          printf 'CANDIDATE_NAME=%s\n' "${candidate_name}" >>"${GITHUB_ENV}"

      - name: Upload tested candidate binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.CANDIDATE_NAME }}
            ${{ runner.temp }}/${{ env.CANDIDATE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
