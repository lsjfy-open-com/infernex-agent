inferenceGateway:
  enabled: true        # 是否部署 inference gateway（含数据面 Gateway 资源 gateway.yaml）
  name: "inference-gateway"
  className: "istio"
  enable_http10: false # 允许 HTTP/1.0（及 HTTP/0.9）客户端访问网关。true 时注入 EnvoyFilter 设置 accept_http_10/default_host_for_http_10
  listeners:
    - name: http
      port: 80
      protocol: HTTP

  # type=NodePort 且配置 nodePorts 时可固定对外端口；多套部署时 nodePort 须唯一。
  service:
    type: NodePort
    nodePorts:
      http: 30088

  istio:
    enabled: true

global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: [] # 私有镜像仓库的 Secret，例如: [{"name": "registry-secret"}]

  env:
    - name: HF_HUB_OFFLINE # HuggingFace Hub 离线开关（1=离线；0=在线）
      value: "0"
    - name: PYTHONHASHSEED # cache-indexer 要求与所有目标 vLLM Pod 保持一致
      value: "0"
    - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES # 与 cache-indexer 的 BlockHash 归一化规则保持一致
      value: "1"

  modelName: "Qwen/Qwen3-8B" # 推理模型名称（用于 served-model-name 和标签）
  modelPath: "" # 推理模型本地路径（可选）。若配置，则 vLLM 使用该路径启动模型，否则使用 modelName。
  autoDownloadModel: true # 是否自动通过 huggingface (hf download) 下载模型，本地已有模型时建议关闭自动下载
  cachePath: "/home/llm_cache" # 推理侧缓存目录（如 HuggingFace / vLLM 的下载与编译缓存）

hermes-router: 
  enabled: true

  inferenceExtension:
    replicas: 1
    pluginsConfigFile: "default-plugins.yaml"
    routing:
      deploymentMode: pd
      # Supported profiles: "" (disabled), random, kv-cache-aware, bucket (pd only), prediction.
      profile: kv-cache-aware
      pd:
        pdLabelName: openfuyao.com/pdRole
        pdGroupLabelName: openfuyao.com/pdGroupID
        prefillValue: prefill
        decodeValue: decode
        leaderValue: leader
      tokenizer:
        model: Qwen/Qwen3-8B
        # tokenizerSource: /models/glm-base-tok. set only when the tokenizer
        # source differs from model (quantized/renamed served models). Empty
        # falls back to model.
      kvCacheAware:
        prefillKVUsageWeight: 1.0
        prefillPrefixWeight: 1.0
        prefillQueueWeight: 1.0
        prefillInflightWeight: 1.0
        decodeKVUsageWeight: 1.0
        decodeQueueWeight: 1.0
        decodeInflightWeight: 1.0
        prefillScoreWeight: 1.0
        decodeScoreWeight: 1.0
      requestTracking:
        persistence:
          enabled: false
          flushThreshold: 100
          outputPath: /tmp/hermes-inflight/completed.jsonl
      cacheIndexer:
        address: http://cache-indexer-service:8080

    tokenizer:
      enabled: true
      # routing.tokenizer.socketPath defaults to this socket when the sidecar is enabled.
      socketPath: /var/run/tokenizer/tokenizer.sock
      provider: huggingface
      extraArgs: []
      extraEnv: []
      # Extra tokenizer-sidecar-only mounts. Use this when you want to mount a
      # hostPath or PVC into the tokenizer container without affecting the main
      # EPP container. If TOKENIZER_CACHE_DIR is not set here, the sidecar image
      # default remains in effect: /workspace/.cache/huggingface/hub.
      volumeMounts:
        - name: tokenizer-cache
          mountPath: /workspace/.cache/huggingface/hub
      # Extra tokenizer-sidecar pod volumes. Use this for tokenizer-local cache
      # or model artifacts without routing them through the main EPP container.
      volumes:
        - name: tokenizer-cache
          hostPath:
            path: /home/llm_cache/huggingface/hub
            type: Directory
    prediction:
      enabled: false
      socketPath: /var/run/hermes/prediction.sock
      # active: route by prediction (enabled: true); shadow: collect training data only (enabled: false).
      predictionMode: active
      timeout: 1s
      maxBatchSize: 128
      ttftWeight: 0.8
      tpotWeight: 0.2
      kvWeight: 1.0
      queueWeight: 1.0
      prefixWeight: 1.0
      inflightWeight: 1.0
      # Set targetModel+modelVersion+modelVolume to load a bundle from
      # <artifactRoot>/<targetModel>/<modelVersion>/ (must match manifest.json).
      # Example bundle: examples/prediction-model/ (Qwen/Qwen3-32B / aggregate-Qwen-Qwen3-32B).
      targetModel: ""
      modelVersion: ""
      env:
        - name: OMP_NUM_THREADS
          value: "2"
      modelVolume:
        hostPath:
          # Example path only; override for your environment. Bundle layout: <targetModel>/<modelVersion>/.
          path: /home/llm_cache/hermes-models
          type: Directory
    affinity: {}

  inferencePool:
    targetPorts:
      - number: 8000
    modelServerType: vllm

  httpRoute:
    inferenceGatewayName: "inference-gateway"

  provider:
    name: istio
    istio:
      destinationRule:
        trafficPolicy:
          tls:
            mode: SIMPLE         
            insecureSkipVerify: true
      retryConfig:
        enabled: true
        retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,5xx,reset"
        numRetries: 3

inference-backend:
  images: 
    inferenceEngine:
      repository: "quay.io/ascend/vllm-ascend"
      tag: "v0.18.0"
  inferenceDevice: "huawei.com/Ascend910"

  # 默认 volumeMounts（所有 vLLM deployment 共享）
  volumeMounts:
    ascend: # Ascend 设备相关的 volumeMounts
      enable: true

  # 默认 volumes（所有 vLLM deployment 共享）
  volumes:
    ascend: # Ascend 设备相关的 volumes
      enable: true

  services:
  - name: qwen3-8b-2p2d-01
    enabled: true
    mode: pd
    service:
      port: 8000
    pdGroupID: "qwen3-8b-2p2d-01"
    kvTransferConfig:
      connectorConfig:
        kv_connector: "MultiConnector"
        kv_connector_extra_config:
          connectors:
            - kv_connector: "MooncakeConnectorV1"
              kv_buffer_device: "npu"
              kv_parallel_size: 1
              kv_connector_extra_config:
                use_ascend_direct: true
            - kv_connector: "AscendStoreConnector"
              kv_buffer_device: "npu"
              kv_parallel_size: 1
              kv_connector_extra_config:
                lookup_rpc_port: "0"
                backend: "mooncake"
      mooncake: # 使用mooncake的配置
        use_store: true # 是否使用 mooncake store
        master: # 共享 mooncake master 配置（多 service 启用时取首个已配置项）
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003 # cache-indexer L3 依赖该 admin HTTP 端口（/get_all_keys、/query_key、/get_all_segments）
          extraArgs: # mooncake_master 启动参数
            - "--eviction_high_watermark_ratio 0.9"
            - "--eviction_ratio 0.1"
        # mooncake 配置文件内容（YAML 格式，initContainer 会自动替换 $POD_IP 并转换为 JSON）
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true

    pd:
      prefill:
        replicas: 2
        enablePrefixCaching: true
        tensorParallelSize: 1
        pipelineParallelSize: 1
        # 多DP部署时，data-parallel-size、data-parallel-size-local、data-parallel-start-rank、
        # data-parallel-address、data-parallel-rpc-port、data-parallel-hybrid-lb 等由 chart 
        # 自动填充，无需在 extraArgs 中手动配置。
        dataParallelSize: 1
        dataParallelSizeLocal: 1
        dataParallelRpcPort: 12890
        maxModelLen: 10000
        maxNumBatchedTokens: 40960
        gpuMemoryUtilization: 0.8
        blockSize: 128
        env:
          - name: HCCL_IF_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        volumeMounts: []
        volumes: []
        extraArgs:
          - --prefix-caching-hash-algo sha256_cbor
          - --enable-prompt-tokens-details

      decode:
        replicas: 2
        enablePrefixCaching: false
        tensorParallelSize: 1
        pipelineParallelSize: 1
        dataParallelSize: 1
        dataParallelSizeLocal: 1
        dataParallelRpcPort: 12777
        maxModelLen: 10000
        maxNumBatchedTokens: 40960
        gpuMemoryUtilization: 0.8
        blockSize: 128
        env:
          - name: HCCL_IF_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        volumeMounts: []
        volumes: []
        extraArgs:
          - --prefix-caching-hash-algo sha256_cbor
          - --enable-prompt-tokens-details

      proxyServer:
        enabled: true
        discoveryInterval: 10

    resources: # p/d 节点资源配置
      requests:
        cpu: "4"
        memory: "64Gi"
      limits:
        cpu: "8"
        memory: "128Gi"

# cache indexer
cache-indexer:
  enabled: true
  resources: # cache-indexer 运行资源，生产环境可按集群规模调整
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 2Gi
  blockKey: # 需与 vLLM 的 PYTHONHASHSEED / hash algo / int hash 开关保持一致
    pythonHashSeed: "0"
    prefixCachingHashAlgo: sha256_cbor
    useIntBlockHashes: true
  discovery:
    refreshInterval: 10s
    vllm:
      zmqPortName: zmq-pub
    mooncakeMaster:
      httpPortName: http
      httpPort: 9003
  service:
    name: cache-indexer-service
    port: 8080

eagle-eye:
  enabled: true

  network-performance-exporter:
    networkPerformanceExporter:
      metricsPort: 8222
      collectInterval: 15

pd-orchestrator:
  elastic-scaler:
    enabled: true # elastic-scaler 组件部署开关

    elasticScaler:
      enabled: true # chart包中默认提供的 elastic-scaler CR 实例开关，开启后会默认安装 elastic-scaler CR

    name: elastic-scaler # 通过 HPA 扩缩的最大副本数和最小副本数
    minReplicas: 1
    maxReplicas: 10

    targetRef:
      kind: resourcescalinggroup
      name: rsg # 该 name 需要对应 resourcescalinggroup.instanceConfig.name
      apiVersion: autoscaling.openfuyao.com/v1alpha1

    trigger:
      scalingAlgorithm: apa
      # 设置 apa 扩缩资源指标
      resource:
        metricsName: cpu
        targetType: Utilization
        targetValue: 70

  resourcescalinggroup:
    enabled: true # resourcescalinggroup 组件的部署开关

    instanceConfig:
      enabled: true # chart包中默认提供的 resource scaling group CR 实例开关，开启后会默认安装 CR 实例
      name: rsg
      targetResources:
      - name: prefill
        resourceRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: qwen3-8b-2p2d-01-prefill
      - name: decode
        resourceRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: qwen3-8b-2p2d-01-decode
      scalingStrategy:
        type: GroupReplication
        groupConfig: 
          groupName: pd 
          scaleDown: 
            metric: 
              expr: "vllm:num_requests_running" 
              type: "Gauge"
              window: "2m"
              aggregator: "avg"
            order: ascending

  tidal:
    enabled: true # tidal 组件的部署开关