{{- include "vllm.validate" $ }}
{{- range .Values.services }}
{{- if and .enabled (eq .mode "aggregated") }}
{{- $dpSize := int (.aggregated.dataParallelSize | default 1) }}
{{- $dpLocal := int (.aggregated.dataParallelSizeLocal | default 1) }}
{{- $lwsSize := div $dpSize $dpLocal }}
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ include "vllm.instance.deploymentName" (dict "service" . "Values" $.Values "Chart" $.Chart "Release" $.Release) }}-aggregated
  labels:
    openfuyao.com/engine: vllm
    openfuyao.com/model: {{ include "vllm.modelName.label" (dict "Values" $.Values) }}
    openfuyao.com/pdRole: {{ include "vllm.pdRole.label" (dict "role" "aggregate" "Values" $.Values) }}
    {{- include "vllm.instance.labels" (dict "service" . "Values" $.Values "Chart" $.Chart "Release" $.Release) | nindent 4 }}
spec:
  replicas: {{ include "vllm.lwsReplicas" (dict "node" .aggregated "default" 1) }}
  leaderWorkerTemplate:
    size: {{ $lwsSize }}
    workerTemplate:
      metadata:
        annotations:
          {{- if $.Values.global }}
          checksum/config: {{ "vllm-config" | sha256sum }}
          {{- end }}
        labels:
          openfuyao.com/engine: vllm
          openfuyao.com/pdRole: {{ include "vllm.pdRole.label" (dict "role" "aggregate" "Values" $.Values) }}
          openfuyao.com/model: {{ include "vllm.modelName.label" (dict "Values" $.Values) }}
          {{- if .aggregated.tensorParallelSize }}
          openfuyao.com/tpSize: {{ .aggregated.tensorParallelSize | quote }}
          {{- end }}
          {{- if .aggregated.dataParallelSize }}
          openfuyao.com/dpSize: {{ .aggregated.dataParallelSize | quote }}
          {{- end }}
          {{- include "vllm.instance.selectorLabels" (dict "service" . "Values" $.Values "Chart" $.Chart "Release" $.Release) | nindent 10 }}
      spec:
        {{- if $.Values.global.imagePullSecrets }}
        imagePullSecrets:
          {{- $.Values.global.imagePullSecrets | toYaml | nindent 10 }}
        {{- end }}
        {{- if or (and .kvTransferConfig .kvTransferConfig.mooncake) (and $.Values.global.autoDownloadModel $.Values.images.modelDownloader) }}
        initContainers:
        {{- if and .kvTransferConfig .kvTransferConfig.mooncake }}
        - name: mooncake-config-init
          image: {{ include "vllm.yamlTool.image" $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -e
            CONFIG_PATH="{{ .kvTransferConfig.mooncake.configPath | default "/app/mooncake.json" }}"
            mkdir -p "$(dirname "$CONFIG_PATH")"
            cat > /tmp/mooncake_config.tpl << 'EOF'
{{- .kvTransferConfig.mooncake.config | default "" | nindent 14 }}
            EOF
            POD_IP_VALUE="${POD_IP:-0.0.0.0}"
            sed "s/\$POD_IP/${POD_IP_VALUE}/g" /tmp/mooncake_config.tpl | yq eval - -o=json > "$CONFIG_PATH"
          env:
          {{- include "vllm.podEnv" . | nindent 10 }}
          volumeMounts:
          - name: mooncake-config
            mountPath: {{ dir (.kvTransferConfig.mooncake.configPath | default "/app/mooncake.json") }}
        {{- end }}
        {{- if and $.Values.global.autoDownloadModel $.Values.images.modelDownloader }}
        - name: huggingface-download
          image: {{ include "vllm.modelDownloader.image" $ | quote }}
          imagePullPolicy: {{ include "vllm.image.pullPolicy" $ }}
          command:
          - hf
          - download
          - {{ $.Values.global.modelName | quote }}
          env:
          {{- include "vllm.baseEnv" (dict "service" . "Values" $.Values) | nindent 10 }}
          volumeMounts:
          - name: rootcache
            mountPath: /root/.cache
            readOnly: false
        {{- end }}
        {{- end }}
        containers:
        - name: aggregated-engine
          image: {{ include "vllm.image" $ | quote }}
          imagePullPolicy: {{ include "vllm.image.pullPolicy" $ }}
          command: ["/bin/bash", "-c"]
          args:
          - |
            set -euo pipefail

            # PHYSICAL_DEVICES stands for the physical devices assigned to the container, use for vllm ascend 0.10.x
            export PHYSICAL_DEVICES=$(ls /dev/davinci* 2>/dev/null | grep -o '[0-9]\+' | sort -n | paste -sd',' - || true)
            # vLLM Ascend 0.18.0+ may ship without some bundled deps; ensure shared libs under /usr/local/lib are on the loader path.
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"

            {{- include "vllm.dpParallelConfig" (dict "dpSize" $dpSize "dpLocal" $dpLocal "rpcPort" .aggregated.dataParallelRpcPort) | nindent 12 }}
            exec vllm serve {{ default $.Values.global.modelName $.Values.global.modelPath }} \
              --served-model-name {{ $.Values.global.modelName }} \
              --trust-remote-code \
              {{- if .aggregated.enablePrefixCaching }}
              --enable-prefix-caching \
              {{- else }}
              --no-enable-prefix-caching \
              {{- end }}
              --port 8000 \
              --tensor-parallel-size {{ .aggregated.tensorParallelSize }} \
              --pipeline-parallel-size {{ .aggregated.pipelineParallelSize | default 1 }} \
              {{- if hasKey .aggregated "maxModelLen" }}
              --max-model-len {{ .aggregated.maxModelLen }} \
              {{- end }}
              {{- if hasKey .aggregated "maxNumBatchedTokens" }}
              --max-num-batched-tokens {{ .aggregated.maxNumBatchedTokens }} \
              {{- end }}
              ${DP_PARALLEL_FLAGS} \
              --gpu-memory-utilization {{ .aggregated.gpuMemoryUtilization | default 0.8 }} \
              --block-size {{ .aggregated.blockSize | default 128 }} \
              --kv-events-config '{"enable_kv_cache_events": true, "publisher":"zmq", "topic":"kv-events"}'{{- if or .kvTransferConfig .aggregated.extraArgs }} \{{- end }}
              {{- if .kvTransferConfig }}
              --kv-transfer-config '{{- include "vllm.kvTransferConfig.json" (dict "kvTransferConfig" .kvTransferConfig "service" . "nodeType" "aggregated") }}'{{- if .aggregated.extraArgs }} \{{- end }}
              {{- end }}
              {{- if .aggregated.extraArgs }}
              {{- $extraArgs := .aggregated.extraArgs }}
              {{- range $index, $arg := $extraArgs }}
              {{ $arg }}{{- if ne (add $index 1) (len $extraArgs) }} \{{- end }}
              {{- end }}
              {{- end }}
          ports:
          - name: aggregated-port
            containerPort: 8000
          - name: zmq-pub
            containerPort: 5557
          env:
          {{- include "vllm.baseEnv" (dict "service" . "Values" $.Values) | nindent 10 }}
          {{- include "vllm.nodeEnv" (dict "nodeEnv" .aggregated.env) | nindent 10 }}
          {{- include "vllm.podEnv" . | nindent 10 }}
          resources:
            {{- include "vllm.aggregated.resources" (dict "service" . "Values" $.Values) | nindent 12 }}
          volumeMounts:
          {{- if and .kvTransferConfig .kvTransferConfig.mooncake }}
          - name: mooncake-config
            mountPath: {{ dir (.kvTransferConfig.mooncake.configPath | default "/app/mooncake.json") }}
            readOnly: true
          {{- end }}
          {{- include "vllm.baseMounts" (dict "service" . "Values" $.Values) | nindent 10 }}
          {{- if .aggregated.volumeMounts }}
          {{- .aggregated.volumeMounts | toYaml | nindent 10 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /v1/models
              port: aggregated-port
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: aggregated-port
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: aggregated-port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        volumes:
        {{- if and .kvTransferConfig .kvTransferConfig.mooncake }}
        - name: mooncake-config
          emptyDir: {}
        {{- end }}
        {{- include "vllm.baseVolumes" (dict "service" . "Values" $.Values) | nindent 8 }}
        {{- if .aggregated.volumes }}
        {{- .aggregated.volumes | toYaml | nindent 8 }}
        {{- end }}
        {{- $nodeSelector := .aggregated.nodeSelector }}
        {{- with $nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .aggregated.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
{{- end }}
