global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: [] # 私有镜像仓库的 Secret，例如: [{"name": "registry-secret"}]

  env:
    - name: HF_HUB_OFFLINE # HuggingFace Hub 离线开关（1=离线；0=在线）
      value: "0"

  modelName: "Qwen/Qwen3-8B" # 推理模型名称
  modelPath: "" # 推理模型本地路径（可选）。若配置，则 vLLM 使用该路径启动模型，否则使用 modelName。
  autoDownloadModel: true # 是否自动通过 huggingface (hf download) 下载模型
  cachePath: "/home/llm_cache" # 推理侧缓存目录（如 HuggingFace / vLLM 的下载与编译缓存）

images:
  inferenceEngine:
    repository: quay.io/ascend/vllm-ascend
    tag: v0.18.0
  proxyServer:
    repository: cr.openfuyao.cn/openfuyao/proxy-server
    tag: latest
  redis: # mooncake store 依赖的 metadata server 镜像
    repository: hub.oepkgs.net/openfuyao/redis
    tag: "8.6.1"
  modelDownloader: # HuggingFace 模型下载 initContainer 使用的镜像
    repository: cr.openfuyao.cn/openfuyao/huggingface-download
    tag: latest
  yamlTool:
    repository: hub.oepkgs.net/openfuyao/mikefarah/yq
    tag: "4.50.1"

inferenceDevice: "huawei.com/Ascend910" # NPU operator 所使用的推理设备资源名称

# 推理后端角色标识 Label（用于 Pod / Service 等 labels）
inferenceRoleLabels:
  proxy: "leader" # 推理后端 Proxy Server 标识 Label
  prefill: "prefill" # 推理后端 prefill 标识 Label
  decode: "decode" # 推理后端 decode 标识 Label
  aggregate: "aggregate" # 推理后端 aggregate 标识 Label

# 默认 volumeMounts（所有 vLLM deployment 共享）
volumeMounts:
  ascend: # Ascend 设备相关的 volumeMounts
    enable: true # 是否启用 Ascend 相关的 volumeMounts
    mounts:
      - name: shm
        mountPath: /dev/shm
      - name: dcmi
        mountPath: /usr/local/dcmi
      - name: npusmi
        mountPath: /usr/local/bin/npu-smi
      - name: lib64
        mountPath: /usr/local/Ascend/driver/lib64
      - name: version
        mountPath: /usr/local/Ascend/driver/version.info
      - name: installinfo
        mountPath: /etc/ascend_install.info
      - name: hccnconf
        mountPath: /etc/hccn.conf

# 默认 volumes（所有 vLLM deployment 共享）
volumes:
  ascend: # Ascend 设备相关的 volumes
    enable: true # 是否启用 Ascend 相关的 volumes
    mounts:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "24Gi"
      - name: dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: npusmi
        hostPath:
          path: /usr/local/bin/npu-smi
          type: File
      - name: lib64
        hostPath:
          path: /usr/local/Ascend/driver/lib64
      - name: version
        hostPath:
          path: /usr/local/Ascend/driver/version.info
          type: File
      - name: installinfo
        hostPath:
          path: /etc/ascend_install.info
          type: File
      - name: hccnconf
        hostPath:
          path: /etc/hccn.conf
          type: File

env: # 推理后端服务的推理后端pod环境变量注入
  - name: VLLM_USE_V1
    value: "1"
  # Ascend 卡通信接口名称
  - name: GLOO_SOCKET_IFNAME # Gloo 通信接口名称
    value: "eth0"
  - name: TP_SOCKET_IFNAME # Tensor Parallel 通信接口名称
    value: "eth0"
  - name: HCCL_SOCKET_IFNAME # HCCL 通信接口名称
    value: "eth0"

services:
  - name: qwen3-8b-1p1d-01
    enabled: true
    mode: pd
    service:
      port: 8000
    pdGroupID: "qwen3-8b-pd-01"

    kvTransferConfig:
      # kv_role、kv_rank、engine_id、tp_size、dp_size 等节点特定字段会自动填充，无需手动配置
      connectorConfig:
        kv_connector: "MultiConnector"
        kv_connector_extra_config:
          connectors:
            - kv_connector: "MooncakeConnectorV1"
              kv_buffer_device: "npu" # KV缓存缓冲区设备类型
              kv_parallel_size: 1 # KV并行大小
              kv_connector_extra_config:
                use_ascend_direct: true
            - kv_connector: "AscendStoreConnector"
              kv_buffer_device: "npu" # KV缓存缓冲区设备类型
              kv_parallel_size: 1 # KV并行大小
              kv_connector_extra_config:
                lookup_rpc_port: "0"
                backend: "mooncake"
      mooncake: # mooncake store提供的内存挂载配置
        configPath: "/app/mooncake.json"
        use_store: true
        metadataServer: # 共享 Redis metadata server Pod 资源（多 service 启用时取首个已配置项）
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
        master: # 共享 mooncake master Pod 资源（多 service 启用时取首个已配置项）
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003 # cache-indexer L3 依赖该 admin HTTP 端口（/get_all_keys、/query_key、/get_all_segments）
          extraArgs: # mooncake_master 启动参数
            - "--eviction_high_watermark_ratio 0.9"
            - "--eviction_ratio 0.1"
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true
    
    pd:      
      prefill:
        replicas: 1
        enablePrefixCaching: true
        tensorParallelSize: 1
        pipelineParallelSize: 1
        # 多DP部署时，data-parallel-size、data-parallel-size-local、data-parallel-start-rank、
        # data-parallel-address、data-parallel-rpc-port、data-parallel-hybrid-lb 等由 chart 
        # 自动填充，无需在 extraArgs 中手动配置。
        dataParallelSizeLocal: 1
        dataParallelSize: 1
        dataParallelRpcPort: 12890
        maxModelLen: 10000
        maxNumBatchedTokens: 40960
        gpuMemoryUtilization: 0.8
        blockSize: 128
        env:
          - name: LOCAL_HOT_CACHE_SIZE
            value: "4294967296"
          - name: UB_SHARE_MEMORY
            value: "true"
        volumeMounts: [] # prefill 节点特定的 volumeMounts
        volumes: [] # prefill 节点特定的 volumes
        extraArgs: [] # prefill 节点额外的 vLLM 启动参数，例如: ["--dtype float16", "--max-num-seqs 256"]

      decode:
        replicas: 1
        enablePrefixCaching: false
        tensorParallelSize: 1
        pipelineParallelSize: 1
        dataParallelSize: 1
        dataParallelSizeLocal: 1
        dataParallelRpcPort: 12777
        maxModelLen: 10000
        maxNumBatchedTokens: 40960
        gpuMemoryUtilization: 0.8
        blockSize: 128
        env:
          - name: UB_SHARE_MEMORY
            value: "true"
        volumeMounts: [] # decode 节点特定的 volumeMounts
        volumes: [] # decode 节点特定的 volumes
        extraArgs: [] # decode 节点额外的 vLLM 启动参数，例如: ["--dtype float16", "--max-num-seqs 256"]
      
      proxyServer:
        enabled: true
        discoveryInterval: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

    resources: # p/d 节点资源配置
      requests:
        cpu: "4"
        memory: "32Gi"
      limits:
        cpu: "8"
        memory: "64Gi"

  - name: qwen3-8b-aggregated-01
    enabled: false
    mode: aggregated
    service:
      port: 8000
    kvTransferConfig: # KV Cache transfer 配置（aggregated 模式使用 store类型的 connector）
      connectorConfig:
        kv_connector: "AscendStoreConnector"
        kv_connector_extra_config:
          lookup_rpc_port: "1"
          backend: "mooncake"
      mooncake: # mooncake store提供的内存挂载配置
        configPath: "/app/mooncake.json"
        use_store: true
        metadataServer:
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
        master:
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003 # cache-indexer L3 依赖该 admin HTTP 端口（/get_all_keys、/query_key、/get_all_segments）
          extraArgs: # mooncake_master 启动参数
            - "--eviction_high_watermark_ratio 0.9"
            - "--eviction_ratio 0.1"
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
        # mooncake 配置文件内容（YAML 格式，initContainer 会自动替换 $POD_IP 并转换为 JSON）
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true

    aggregated:
      replicas: 1
      enablePrefixCaching: true
      tensorParallelSize: 1
      pipelineParallelSize: 1
      dataParallelSize: 1
      dataParallelSizeLocal: 1
      dataParallelRpcPort: 12890
      gpuMemoryUtilization: 0.8
      blockSize: 128
      maxModelLen: 10000
      maxNumBatchedTokens: 40960
      env:
        - name: UB_SHARE_MEMORY
          value: "true"
      volumeMounts: [] # aggregated 节点特定的 volumeMounts
      volumes: [] # aggregated 节点特定的 volumes
      extraArgs: [] # aggregated 节点额外的 vLLM 启动参数，例如: ["--dtype float16", "--max-num-seqs 256"]

    resources: # aggregated 节点资源配置
      requests:
        cpu: "4"
        memory: "32Gi"
      limits:
        cpu: "8"
        memory: "64Gi"
