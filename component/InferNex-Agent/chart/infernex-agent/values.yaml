replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: cr.openfuyao.cn/openfuyao/infernex-agent
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

dashboard:
  enabled: true
  port: 8081
  service:
    # Keep the dashboard internal by default. values-master-node.yaml exposes
    # only this read-only port through a NodePort.
    type: ClusterIP
    port: 8081
    nodePort: null
    externalTrafficPolicy: ""

supervisor:
  enabled: true
  scanInterval: 60s
  eventSinceMinutes: 60
  eventLimit: 25
  maxAnalysesPerScan: 10
  # Empty inherits rbac.targetNamespaces, then the Helm release namespace.
  namespaces: []
  analysis:
    openAI:
      # Configure both baseURL and model to enable advisory model analysis.
      # The API key is read only from an existing Secret.
      baseURL: ""
      model: ""
      timeout: 60s
      existingSecret: ""
      secretKey: api-key
  remediation:
    # Opt-in twice: enable this controller-wide switch and annotate an
    # InferNexService with agent.infernex.io/auto-recovery=true plus an
    # approved recovery-profile name.
    enabled: false
    templateNamespace: infernex-bridge-system
    minCriticalScans: 3

rbac:
  # Cluster-wide observation is deliberately opt-in.
  clusterWide: false
  # Empty means only the Helm release namespace.
  targetNamespaces: []

tools:
  deployment:
    # Catalog deployment is deliberately opt-in. When enabled, the Agent can
    # only create/delete InferNexService resources in targetNamespaces; it
    # still cannot submit arbitrary Kubernetes objects.
    enabled: false

networkPolicy:
  enabled: true
  # Additional namespaces that host an authorized MCP client.
  additionalNamespaceNames: []
  # Source CIDRs allowed to reach the read-only dashboard. When empty, only
  # pods in the Helm release namespace can reach it.
  dashboardAllowedCIDRs: []

placement:
  # Adds control-plane/master node affinity and standard NoSchedule
  # tolerations. Use this for a dedicated InferNex management-node install.
  controlPlaneOnly: false

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
