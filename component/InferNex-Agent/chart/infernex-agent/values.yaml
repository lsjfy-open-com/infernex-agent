replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: cr.openfuyao.cn/openfuyao/infernex-agent
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

dashboard:
  enabled: true
  port: 8081
  service:
    # Keep the dashboard internal by default. values-master-node.yaml exposes
    # only this read-only port through a NodePort.
    type: ClusterIP
    port: 8081
    nodePort: null
    externalTrafficPolicy: ""

supervisor:
  enabled: true
  scanInterval: 60s
  eventSinceMinutes: 60
  eventLimit: 25
  maxAnalysesPerScan: 10
  # Global per-scan log collection budget during a widespread outage.
  maxDiagnosticsPerScan: 10
  # Pod logs can contain prompts and application data. Log diagnostics are
  # therefore a separate opt-in even when the supervisor is enabled. Only
  # Pods carrying the selected InferNexService owner label are read.
  diagnostics:
    logs:
      enabled: false
  # Empty inherits rbac.targetNamespaces, then the Helm release namespace.
  namespaces: []
  analysis:
    openAI:
      # Configure both baseURL and model to enable advisory model analysis.
      # The API key is read only from an existing Secret.
      baseURL: ""
      model: ""
      timeout: 60s
      existingSecret: ""
      secretKey: api-key
  remediation:
    # Opt-in twice: enable this controller-wide switch and annotate an
    # InferNexService with agent.infernex.io/auto-recovery=true plus an
    # approved recovery-profile name.
    enabled: false
    templateNamespace: infernex-bridge-system
    minCriticalScans: 3

experiments:
  # Progressive experiments require log diagnostics and namespace-scoped
  # write RBAC. Each profile must be an administrator-approved sparse
  # InferNexServiceConfig in templateNamespace.
  enabled: false
  templateNamespace: infernex-bridge-system
  readinessTimeout: 20m
  soakDuration: 5m
  diagnosticInterval: 30s

rbac:
  # Cluster-wide observation is deliberately opt-in.
  clusterWide: false
  # Empty means only the Helm release namespace.
  targetNamespaces: []

tools:
  deployment:
    # Catalog deployment is deliberately opt-in. When enabled, the Agent can
    # only create/delete InferNexService resources in targetNamespaces; it
    # still cannot submit arbitrary Kubernetes objects.
    enabled: false

changeSafety:
  # Newly created catalog services that do not become Ready in this window
  # are deleted automatically, restoring the exact pre-deployment state.
  deploymentReadinessTimeout: 10m
  stateDir: /var/lib/infernex-agent
  persistence:
    # emptyDir survives a container restart but not Pod replacement. Enable a
    # PVC for production so in-flight change records survive Agent upgrades.
    enabled: false
    existingClaim: ""
    storageClassName: ""
    size: 1Gi

networkPolicy:
  enabled: true
  # Additional namespaces that host an authorized MCP client.
  additionalNamespaceNames: []
  # Source CIDRs allowed to reach the read-only dashboard. When empty, only
  # pods in the Helm release namespace can reach it.
  dashboardAllowedCIDRs: []

placement:
  # Adds control-plane/master node affinity and standard NoSchedule
  # tolerations. Use this for a dedicated InferNex management-node install.
  controlPlaneOnly: false

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
