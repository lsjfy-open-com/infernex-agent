{{- $openAI := .Values.supervisor.analysis.openAI }}
{{- if ne (empty $openAI.baseURL) (empty $openAI.model) }}
{{- fail "supervisor.analysis.openAI.baseURL and model must be configured together" }}
{{- end }}
{{- if and .Values.supervisor.remediation.enabled (not .Values.supervisor.enabled) }}
{{- fail "supervisor.remediation.enabled requires supervisor.enabled=true" }}
{{- end }}
{{- if and .Values.supervisor.remediation.enabled (empty .Values.supervisor.remediation.templateNamespace) }}
{{- fail "supervisor.remediation.enabled requires a templateNamespace" }}
{{- end }}
{{- if and .Values.experiments.enabled (not .Values.supervisor.enabled) }}
{{- fail "experiments.enabled requires supervisor.enabled=true" }}
{{- end }}
{{- if and .Values.experiments.enabled (not .Values.supervisor.diagnostics.logs.enabled) }}
{{- fail "experiments.enabled requires supervisor.diagnostics.logs.enabled=true" }}
{{- end }}
{{- if and .Values.experiments.enabled (empty .Values.experiments.templateNamespace) }}
{{- fail "experiments.enabled requires experiments.templateNamespace" }}
{{- end }}
{{- if and .Values.tools.deployment.enabled (not .Values.tools.deployment.testCatalog) (empty .Values.tools.deployment.workspaceNamespace) }}
{{- fail "tools.deployment.enabled requires tools.deployment.workspaceNamespace" }}
{{- end }}
{{- if and .Values.tools.deployment.enabled (not .Values.tools.deployment.testCatalog) (empty .Values.tools.deployment.templateNamespace) }}
{{- fail "tools.deployment.enabled requires tools.deployment.templateNamespace" }}
{{- end }}
{{- if and .Values.experiments.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "experiments.enabled requires replicaCount=1 because experiment coordination is single-writer" }}
{{- end }}
{{- if lt (int .Values.supervisor.maxDiagnosticsPerScan) 1 }}
{{- fail "supervisor.maxDiagnosticsPerScan must be at least 1" }}
{{- end }}
{{- if and .Values.supervisor.enabled (not .Values.rbac.clusterWide) .Values.supervisor.namespaces }}
{{- $allowedNamespaces := .Values.rbac.targetNamespaces }}
{{- if not $allowedNamespaces }}
{{- $allowedNamespaces = list .Release.Namespace }}
{{- end }}
{{- range .Values.supervisor.namespaces }}
{{- if not (has . $allowedNamespaces) }}
{{- fail (printf "supervisor namespace %q requires matching rbac.targetNamespaces entry" .) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infernex-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infernex-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "infernex-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infernex-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "infernex-agent.serviceAccountName" . }}
      # Keep the pod-wide automount disabled. The read-only Kubernetes identity
      # is projected only into the domain-tool container so an optional agent
      # runtime sidecar does not inherit cluster credentials.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: infernex-agent
          image: {{ include "infernex-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --transport=streamable-http
            - --listen-address=:8080
            {{- if .Values.dashboard.enabled }}
            - --dashboard-listen-address=:{{ .Values.dashboard.port }}
            {{- end }}
            {{- if .Values.supervisor.enabled }}
            {{- $scanNamespaces := .Values.supervisor.namespaces }}
            {{- if not $scanNamespaces }}
            {{- $scanNamespaces = .Values.rbac.targetNamespaces }}
            {{- end }}
            {{- if not $scanNamespaces }}
            {{- $scanNamespaces = list .Release.Namespace }}
            {{- end }}
            {{- if and .Values.tools.deployment.enabled (not .Values.tools.deployment.testCatalog) }}
            {{- $scanNamespaces = uniq (append $scanNamespaces .Values.tools.deployment.workspaceNamespace) }}
            {{- end }}
            - --scan-namespaces={{ join "," $scanNamespaces }}
            - --scan-interval={{ .Values.supervisor.scanInterval }}
            - --event-since-minutes={{ .Values.supervisor.eventSinceMinutes }}
            - --event-limit={{ .Values.supervisor.eventLimit }}
            - --max-analyses-per-scan={{ .Values.supervisor.maxAnalysesPerScan }}
            - --max-diagnostics-per-scan={{ .Values.supervisor.maxDiagnosticsPerScan }}
            {{- if .Values.supervisor.diagnostics.logs.enabled }}
            - --enable-log-diagnostics
            {{- end }}
            {{- if $openAI.baseURL }}
            - {{ printf "--openai-base-url=%s" $openAI.baseURL | quote }}
            - {{ printf "--openai-model=%s" $openAI.model | quote }}
            - --openai-timeout={{ $openAI.timeout }}
            {{- end }}
            {{- if .Values.supervisor.remediation.enabled }}
            - --enable-auto-recovery
            - --recovery-template-namespace={{ .Values.supervisor.remediation.templateNamespace }}
            - --recovery-min-critical-scans={{ .Values.supervisor.remediation.minCriticalScans }}
            {{- end }}
            {{- if .Values.experiments.enabled }}
            - --enable-experiments
            - --experiment-template-namespace={{ .Values.experiments.templateNamespace }}
            - --experiment-readiness-timeout={{ .Values.experiments.readinessTimeout }}
            - --experiment-soak-duration={{ .Values.experiments.soakDuration }}
            - --experiment-diagnostic-interval={{ .Values.experiments.diagnosticInterval }}
            {{- end }}
            {{- end }}
            {{- if .Values.tools.deployment.enabled }}
            - --enable-deployment
            {{- if .Values.tools.deployment.testCatalog }}
            - --enable-test-catalog
            {{- else }}
            - --deployment-namespace={{ .Values.tools.deployment.workspaceNamespace }}
            - --deployment-template-namespace={{ .Values.tools.deployment.templateNamespace }}
            {{- $deploymentSourceNamespaces := .Values.rbac.targetNamespaces }}
            {{- if not $deploymentSourceNamespaces }}
            {{- $deploymentSourceNamespaces = list .Release.Namespace }}
            {{- end }}
            - --deployment-source-namespaces={{ join "," $deploymentSourceNamespaces }}
            {{- end }}
            - --deployment-readiness-timeout={{ .Values.changeSafety.deploymentReadinessTimeout }}
            {{- end }}
            {{- if or .Values.tools.deployment.enabled .Values.supervisor.remediation.enabled .Values.experiments.enabled }}
            - --state-dir={{ .Values.changeSafety.stateDir }}
            {{- end }}
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
            {{- if .Values.dashboard.enabled }}
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
            {{- end }}
          {{- if $openAI.existingSecret }}
          env:
            - name: INFERNEX_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $openAI.existingSecret }}
                  key: {{ $openAI.secretKey }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: agent-state
              mountPath: {{ .Values.changeSafety.stateDir }}
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: agent-state
          {{- if .Values.changeSafety.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "infernex-agent.fullname" .)) .Values.changeSafety.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.placement.controlPlaneOnly }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if or .Values.placement.controlPlaneOnly .Values.tolerations }}
      tolerations:
        {{- if .Values.placement.controlPlaneOnly }}
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        {{- end }}
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
