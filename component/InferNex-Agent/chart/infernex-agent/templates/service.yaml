apiVersion: v1
kind: Service
metadata:
  name: {{ include "infernex-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infernex-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "infernex-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
