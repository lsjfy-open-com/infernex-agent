apiVersion: v1
kind: Namespace
metadata:
  name: models
---
apiVersion: v1
kind: Namespace
metadata:
  name: infernex-bridge-system
---
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexServiceConfig
metadata:
  name: smoke-stable-base
  namespace: infernex-bridge-system
spec: {}
---
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexServiceConfig
metadata:
  name: smoke-feature-mooncake
  namespace: infernex-bridge-system
  labels:
    agent.infernex.io/approved-experiment-feature: "true"
spec:
  components:
    mooncake:
      enabled: true
---
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexService
metadata:
  name: smoke
  namespace: models
spec:
  baseRefs:
    - name: smoke-stable-base
  model:
    name: smoke-model
    uri: https://user:token@example.invalid/models/smoke?signature=secret#fragment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-engine
  namespace: models
  labels:
    infernex.io/owner: smoke
    infernex.io/component: engine-aggregate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-engine
  template:
    metadata:
      labels:
        app: smoke-engine
        infernex.io/owner: smoke
        infernex.io/component: engine-aggregate
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
